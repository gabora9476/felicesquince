<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis XV Años · Dayanis Diaz</title>
<meta name="description" content="Invitación digital a los XV años de Dayanis Diaz">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     PALETA — tomada de la imagen base para que todo combine
     ============================================================ */
  :root{
    --cielo-claro:#eaf6ff;
    --cielo:#8fcff5;
    --azul-real:#1b3a6b;
    --azul-texto:#0b1626;
    --plata:#e3ecf5;
    --plata-sombra:#9fb3c8;
    --dorado:#cf9f4e;
    --dorado-claro:#f0dba0;
    --vidrio:rgba(255,255,255,0.4);
    --vidrio-borde:rgba(255,255,255,0.7);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0;
    padding:0;
    background:linear-gradient(180deg,#cfe9fb 0%,#a9d8f2 100%);
    overflow-x:hidden;
    color:var(--azul-texto);
    font-family:'Cormorant Garamond',serif;
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
    -webkit-touch-callout:none; /* evita el menú "Guardar imagen" al mantener presionado en iOS */
  }

  img{
    -webkit-user-drag:none;
    user-drag:none;
    -khtml-user-drag:none;
    -moz-user-drag:none;
    -o-user-drag:none;
    pointer-events:none; /* bloquea clic derecho / arrastre / long-press directo sobre la imagen */
  }

  .pagina{
    position:relative;
    max-width:600px;
    margin:0 auto;
    background:#bfe2f7;
    box-shadow:0 0 70px rgba(10,40,80,0.28);
  }

  /* ============================================================
     CAPAS FIJAS DE EFECTOS (mariposas, lluvia, destellos ambiente)
     ============================================================ */
  .capa-efectos{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  #campoDestellos{ z-index:20; }
  #capaMariposas{ z-index:45; }
  #capaLluvia{ z-index:50; }

  .destello{
    position:absolute; width:10px; height:10px; opacity:0;
    animation-name:centellear; animation-iteration-count:infinite; animation-timing-function:ease-in-out;
  }
  .destello svg{ width:100%; height:100%; display:block; }
  @keyframes centellear{
    0%,100%{opacity:0;transform:scale(.3) rotate(0deg);}
    50%{opacity:var(--brillo,.9);transform:scale(1) rotate(25deg);}
  }

  /* ============================================================
     IMAGEN ÚNICA, COMPLETA Y SIN DIVIDIR — todo lo demás flota
     encima de ella con posicionamiento absoluto
     ============================================================ */
  .marco{
    position:relative;
    line-height:0;
    width:100%;
  }
  .marco > img{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:1200/2598;
    position:relative;
    z-index:1;
  }

  /* Destellos animados sobre el texto "Celebraré" */
  .brillo-celebrare{ position:absolute; pointer-events:none; z-index:5; }
  .brillo-celebrare .chispa{ position:absolute; width:20px; height:20px; animation:centellear 2.6s ease-in-out infinite; }
  .brillo-celebrare .chispa svg{ width:100%; height:100%; }

  /* Puntos interactivos invisibles sobre la imagen (mapa, sobre, si asistiré) */
  .punto-interactivo{
    position:absolute; z-index:6;
    background:transparent; border:none; padding:0; margin:0; cursor:pointer; display:block;
  }
  .punto-interactivo::after{
    content:''; position:absolute; inset:-10%; border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,0) 70%);
    opacity:0; animation:pulsoSuave 3.4s ease-in-out infinite;
  }
  @keyframes pulsoSuave{
    0%,100%{opacity:0;transform:scale(.88);}
    50%{opacity:.6;transform:scale(1.08);}
  }

  /* ============================================================
     WIDGETS FLOTANTES: calendario (entre "Celebraré" y "Faltando")
     y contador (debajo de "Faltando"), SOBRE la imagen
     ============================================================ */
  .widget-calendario{
    position:absolute;
    top:35.6%;
    left:50%;
    transform:translateX(-50%);
    width:clamp(150px, 40.83%, 245px); /* 245px es el tamaño de escritorio; en móvil escala junto con la imagen sin bajar de 150px */
    z-index:8;
    pointer-events:none;
  }
  .widget-contador{
    position:absolute;
    top:48.6%;
    left:50%;
    transform:translateX(-50%);
    width:clamp(160px, 41.67%, 250px); /* 250px es el tamaño de escritorio; en móvil escala junto con la imagen sin bajar de 160px */
    z-index:8;
    pointer-events:none;
  }

  .tarjeta-vidrio{
    width:100%;
    background:var(--vidrio);
    border:1px solid var(--vidrio-borde);
    border-radius:12px;
    box-shadow:0 6px 18px rgba(15,50,90,.25), inset 0 0 14px rgba(255,255,255,.35);
    -webkit-backdrop-filter:blur(7px);
    backdrop-filter:blur(7px);
  }

  /* ---------- Calendario compacto ---------- */
  .cal-tarjeta{ padding:9px 11px 10px; }
  .cal-mes{
    text-align:center;
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:clamp(12px,3.4vw,15px);
    letter-spacing:2.8px;
    color:var(--azul-real);
    margin:0 0 6px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:2.5px;
  }
  .cal-dia{
    position:relative;
    text-align:center;
    font-size:clamp(9px,2.6vw,11px);
    padding:2.5px 0;
    color:var(--azul-texto);
    line-height:1.3;
  }
  .cal-dia.vacio{ visibility:hidden; }
  .cal-dia.resaltado{ font-family:'Cinzel',serif; font-weight:700; color:#fff; }
  .cal-dia.resaltado .aro{
    position:absolute; inset:0; margin:auto;
    width:80%; aspect-ratio:1/1; max-width:21px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#3f6ea8,#16233f 75%);
    border:1.2px solid var(--dorado-claro);
    box-shadow:0 0 0 1.5px rgba(207,159,78,.4), 0 0 9px rgba(207,159,78,.7);
    animation:latido 2.4s ease-in-out infinite;
    z-index:0;
  }
  .cal-dia.resaltado span{ position:relative; z-index:1; display:block; }
  @keyframes latido{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.12);}
  }

  /* ---------- Contador compacto ---------- */
  .cont-tarjeta{
    padding:6px 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
  }
  .cont-bloque{ text-align:center; min-width:34px; }
  .cont-num{
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:clamp(13px,4vw,16px);
    color:var(--azul-real);
    line-height:1.05;
  }
  .cont-lbl{
    display:block;
    margin-top:1px;
    font-size:clamp(6px,1.7vw,7px);
    letter-spacing:1px;
    color:var(--azul-real);
    opacity:.75;
    font-family:'Cinzel',serif;
  }
  .cont-sep{ font-family:'Cinzel',serif; font-size:clamp(11px,3.4vw,14px); color:var(--dorado); }
  .cont-fin{
    text-align:center; font-family:'Cinzel',serif; letter-spacing:1px;
    color:var(--azul-real); font-size:clamp(10px,2.8vw,12px); padding:4px 2px;
  }

  /* ============================================================
     MARIPOSAS Y LLUVIA DE SOBRES
     ============================================================ */
  .mariposa-volando{
    position:fixed; width:34px; height:28px; pointer-events:none;
    will-change:transform,opacity; animation:volar 1.9s ease-out forwards;
  }
  .mariposa-volando svg{ width:100%; height:100%; display:block; }
  @keyframes volar{
    0%{ transform:translate(0,0) rotate(0deg) scale(.4); opacity:0; }
    12%{ opacity:1; transform:translate(var(--dx1),var(--dy1)) rotate(var(--rot1)) scale(1); }
    100%{ transform:translate(var(--dx2),var(--dy2)) rotate(var(--rot2)) scale(.85); opacity:0; }
  }

  .sobre-cayendo{
    position:absolute; top:-60px; width:38px; height:auto;
    animation-name:caer; animation-timing-function:linear; animation-fill-mode:forwards;
  }
  .sobre-cayendo svg{ width:100%; height:auto; display:block; }
  @keyframes caer{
    0%{ transform:translate(0,0) rotate(0deg); }
    100%{ transform:translate(var(--deriva),115vh) rotate(var(--giro)); }
  }

  button.punto-interactivo{ -webkit-appearance:none; appearance:none; }
  ::selection{ background:rgba(27,58,107,.25); }

  @media (min-width:601px){
    .pagina{ border-radius:6px; overflow:hidden; }
  }
</style>
</head>
<body>

<div class="capa-efectos" id="campoDestellos" aria-hidden="true"></div>
<div class="capa-efectos" id="capaMariposas" aria-hidden="true"></div>
<div class="capa-efectos" id="capaLluvia" aria-hidden="true"></div>

<main class="pagina">
  <div class="marco">
    <img src="invitacion_base.png" alt="Mis XV años — Dayanis Diaz" loading="eager" fetchpriority="high" decoding="async" draggable="false" oncontextmenu="return false;">

    <!-- Destellos animados sobre "Celebraré" -->
    <div class="brillo-celebrare" style="top:32.93%;left:25.88%;width:22.35%;height:2.83%;">
      <div class="chispa" style="top:0%;left:6%;animation-delay:.1s;">
        <svg viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#ffffff"/></svg>
      </div>
      <div class="chispa" style="top:-40%;left:46%;width:15px;height:15px;animation-delay:.9s;">
        <svg viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#ffffff"/></svg>
      </div>
      <div class="chispa" style="top:20%;left:82%;width:17px;height:17px;animation-delay:1.6s;">
        <svg viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#ffffff"/></svg>
      </div>
      <div class="chispa" style="top:35%;left:-4%;width:13px;height:13px;animation-delay:2.2s;">
        <svg viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#ffffff"/></svg>
      </div>
    </div>

    <!-- Calendario: flota entre "Los Celebraré" y "Faltando:" -->
    <div class="widget-calendario">
      <div class="tarjeta-vidrio cal-tarjeta">
        <p class="cal-mes" id="calMes">OCTUBRE</p>
        <div class="cal-grid" id="calGrid"><!-- generado con JavaScript --></div>
      </div>
    </div>

    <!-- Contador: flota debajo de "Faltando:" -->
    <div class="widget-contador">
      <div class="tarjeta-vidrio cont-tarjeta" id="filaContador">
        <div class="cont-bloque">
          <div class="cont-num" id="numDias">00</div>
          <span class="cont-lbl">DÍAS</span>
        </div>
        <div class="cont-sep">:</div>
        <div class="cont-bloque">
          <div class="cont-num" id="numHoras">00</div>
          <span class="cont-lbl">HRS</span>
        </div>
        <div class="cont-sep">:</div>
        <div class="cont-bloque">
          <div class="cont-num" id="numMinutos">00</div>
          <span class="cont-lbl">MIN</span>
        </div>
      </div>
    </div>

    <!-- Ubicación: abre Google Maps -->
    <button class="punto-interactivo" id="btnMapa"
      style="top:53.03%;left:32.94%;width:34.35%;height:4.78%;"
      aria-label="Abrir la ubicación del salón en Google Maps"></button>

    <!-- Sobre dorado: dispara la lluvia de sobres -->
    <button class="punto-interactivo" id="btnSobre"
      style="top:70.63%;left:27.29%;width:31.53%;height:6.74%;"
      aria-label="Lluvia de sobres"></button>

    <!-- "Si asistiré": abre WhatsApp -->
    <button class="punto-interactivo" id="btnConfirmar"
      style="top:82.81%;left:25.88%;width:43.29%;height:3.70%;"
      aria-label="Confirmar asistencia por WhatsApp"></button>
  </div>
</main>

<!-- Audio de ambientación de fondo -->
<audio id="audioFondo" src="1.mp3" loop preload="auto" playsinline></audio>

<script>
/* ================================================================
   CONFIGURACIÓN GENERAL — edita aquí los datos del evento
   ================================================================ */
const CONFIG = {
  nombreQuinceanera : "Dayanis Diaz",
  fechaEvento       : "2026-10-03T20:00:00-04:00", // fecha/hora del evento (hora de Venezuela)
  mesCalendario     : 9,      // Octubre = índice 9 (Enero = 0)
  anioCalendario    : 2026,
  diaResaltado      : 3,
  telefonoWhatsapp  : "584228745777",
  urlMaps           : `https://www.google.com/maps/place/10°29'16.1"N+66°49'31.5"W/@10.4878056,-66.8254167,17z/data=!3m1!4b1!4m4!3m3!8m2!3d10.4878056!4d-66.8254167?hl=es&entry=ttu&g_ep=EgoyMDI2MDkwMi4wIKXMDSoASAFQAw%3D%3D`,
  audioArchivo      : "1.mp3",
  audioVolumen      : 0.12  // 0.0 (silencio) a 1.0 (máximo) — volumen bajo, solo de ambiente
};

/* ================================================================
   1) DESTELLOS AMBIENTALES DE FONDO
   ================================================================ */
(function crearDestellosAmbientales(){
  const contenedor = document.getElementById('campoDestellos');
  const total = 46;
  const svgChispa = '<svg viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#ffffff"/></svg>';
  for(let i=0;i<total;i++){
    const d = document.createElement('div');
    d.className = 'destello';
    const tam = 4 + Math.random()*9;
    d.style.width = tam+'px';
    d.style.height = tam+'px';
    d.style.top = (Math.random()*100)+'%';
    d.style.left = (Math.random()*100)+'%';
    d.style.setProperty('--brillo', (0.5 + Math.random()*0.5).toFixed(2));
    d.style.animationDuration = (2 + Math.random()*3.5)+'s';
    d.style.animationDelay = (Math.random()*5)+'s';
    d.innerHTML = svgChispa;
    contenedor.appendChild(d);
  }
})();

/* ================================================================
   2) MARIPOSAS AZULES AL TOCAR CUALQUIER PARTE DE LA PÁGINA
   ================================================================ */
const capaMariposas = document.getElementById('capaMariposas');

function svgMariposa(){
  return `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="alaG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#bfe3ff"/>
        <stop offset="100%" stop-color="#3f7fd1"/>
      </linearGradient>
    </defs>
    <path d="M50 38 C 30 -4, -6 2, 4 30 C 9 48, 32 46, 50 38 Z" fill="url(#alaG)" stroke="#16305c" stroke-width="2"/>
    <path d="M50 38 C 70 -4, 106 2, 96 30 C 91 48, 68 46, 50 38 Z" fill="url(#alaG)" stroke="#16305c" stroke-width="2"/>
    <path d="M50 40 C 34 58, 14 66, 22 76 C 36 74, 46 56, 50 40 Z" fill="#8fc4f2" stroke="#16305c" stroke-width="1.6"/>
    <path d="M50 40 C 66 58, 86 66, 78 76 C 64 74, 54 56, 50 40 Z" fill="#8fc4f2" stroke="#16305c" stroke-width="1.6"/>
    <line x1="50" y1="18" x2="50" y2="64" stroke="#16305c" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

let mariposasActivas = 0;
const MAX_MARIPOSAS = 34;

function lanzarMariposa(x, y){
  if(mariposasActivas >= MAX_MARIPOSAS) return;
  mariposasActivas++;

  const m = document.createElement('div');
  m.className = 'mariposa-volando';
  const lado = (Math.random() < 0.5 ? -1 : 1);
  const dx1 = (lado*(20 + Math.random()*30)).toFixed(0)+'px';
  const dy1 = (-(40 + Math.random()*30)).toFixed(0)+'px';
  const dx2 = (lado*(50 + Math.random()*70)).toFixed(0)+'px';
  const dy2 = (-(140 + Math.random()*120)).toFixed(0)+'px';
  const tam = 22 + Math.random()*20;

  m.style.left = (x - tam/2)+'px';
  m.style.top = (y - tam/2)+'px';
  m.style.width = tam+'px';
  m.style.height = (tam*0.8)+'px';
  m.style.setProperty('--dx1', dx1);
  m.style.setProperty('--dy1', dy1);
  m.style.setProperty('--dx2', dx2);
  m.style.setProperty('--dy2', dy2);
  m.style.setProperty('--rot1', (lado*18)+'deg');
  m.style.setProperty('--rot2', (lado*-24)+'deg');
  m.innerHTML = svgMariposa();

  m.addEventListener('animationend', () => { m.remove(); mariposasActivas--; });
  capaMariposas.appendChild(m);
}

document.addEventListener('pointerdown', (e) => {
  lanzarMariposa(e.clientX, e.clientY);
});

/* ================================================================
   3) CALENDARIO DE OCTUBRE — genera la cuadrícula y enmarca el día 3
   ================================================================ */
(function generarCalendario(){
  const nombresMes = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
  document.getElementById('calMes').textContent = nombresMes[CONFIG.mesCalendario];

  const grid = document.getElementById('calGrid');

  const primerDia = new Date(CONFIG.anioCalendario, CONFIG.mesCalendario, 1);
  const diaSemanaInicio = primerDia.getDay(); // 0 = domingo
  const totalDias = new Date(CONFIG.anioCalendario, CONFIG.mesCalendario+1, 0).getDate();

  for(let i=0;i<diaSemanaInicio;i++){
    const vacio = document.createElement('div');
    vacio.className = 'cal-dia vacio';
    grid.appendChild(vacio);
  }

  for(let dia=1; dia<=totalDias; dia++){
    const celda = document.createElement('div');
    if(dia === CONFIG.diaResaltado){
      celda.className = 'cal-dia resaltado';
      celda.innerHTML = '<span class="aro"></span><span>'+dia+'</span>';
    }else{
      celda.className = 'cal-dia';
      celda.textContent = dia;
    }
    grid.appendChild(celda);
  }
})();

/* ================================================================
   4) CONTADOR REGRESIVO (horas, minutos y segundos)
   ================================================================ */
(function contadorRegresivo(){
  const fechaObjetivo = new Date(CONFIG.fechaEvento).getTime();
  const elDias  = document.getElementById('numDias');
  const elHoras = document.getElementById('numHoras');
  const elMin   = document.getElementById('numMinutos');
  const fila    = document.getElementById('filaContador');

  function actualizar(){
    const ahora = Date.now();
    const diff = fechaObjetivo - ahora;

    if(diff <= 0){
      fila.innerHTML = '<p class="cont-fin">¡Hoy celebramos mis XV años!</p>';
      clearInterval(temporizador);
      return;
    }
    const dias    = Math.floor(diff / 86400000);
    const horas   = Math.floor((diff % 86400000) / 3600000);
    const minutos = Math.floor((diff % 3600000) / 60000);

    elDias.textContent  = String(dias).padStart(2,'0');
    elHoras.textContent = String(horas).padStart(2,'0');
    elMin.textContent   = String(minutos).padStart(2,'0');
  }

  actualizar();
  const temporizador = setInterval(actualizar, 30000); // cada 30s alcanza para minutos
})();

/* ================================================================
   5) MARCADOR DE UBICACIÓN → GOOGLE MAPS
   ================================================================ */
document.getElementById('btnMapa').addEventListener('click', () => {
  window.open(CONFIG.urlMaps, '_blank', 'noopener');
});

/* ================================================================
   6) SOBRE DORADO → LLUVIA DE SOBRES EN TODA LA PÁGINA
   ================================================================ */
const capaLluvia = document.getElementById('capaLluvia');
let lluviaEnCurso = false;

function svgSobre(){
  return `<svg viewBox="0 0 60 44" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="58" height="42" rx="4" fill="#e6c465" stroke="#a97a1e" stroke-width="1.5"/>
    <path d="M2,3 L30,26 L58,3" fill="none" stroke="#a97a1e" stroke-width="1.5"/>
    <path d="M2,4 L2,41 L23,21 Z" fill="#f3dd97" opacity=".55"/>
    <path d="M58,4 L58,41 L37,21 Z" fill="#f3dd97" opacity=".55"/>
    <circle cx="30" cy="22" r="4.5" fill="#fffbe9" stroke="#a97a1e" stroke-width="1"/>
  </svg>`;
}

function lluviaDeSobres(){
  if(lluviaEnCurso) return;
  lluviaEnCurso = true;

  const totalSobres = 42;
  for(let i=0;i<totalSobres;i++){
    setTimeout(()=>{
      const s = document.createElement('div');
      s.className = 'sobre-cayendo';
      const tam = 26 + Math.random()*22;
      s.style.left = (Math.random()*96)+'%';
      s.style.width = tam+'px';
      s.style.setProperty('--deriva', ((Math.random()*2-1)*80).toFixed(0)+'px');
      s.style.setProperty('--giro', ((Math.random()*2-1)*260).toFixed(0)+'deg');
      s.style.animationDuration = (3.2 + Math.random()*2.2)+'s';
      s.innerHTML = svgSobre();
      capaLluvia.appendChild(s);
      s.addEventListener('animationend', ()=> s.remove());
    }, i*70);
  }

  setTimeout(()=>{ lluviaEnCurso = false; }, totalSobres*70 + 5600);
}

document.getElementById('btnSobre').addEventListener('click', lluviaDeSobres);

/* ================================================================
   7) "SI ASISTIRÉ" → CONFIRMAR POR WHATSAPP
   ================================================================ */
document.getElementById('btnConfirmar').addEventListener('click', () => {
  const mensaje = 'Hola, confirmo mi asistencia a la fiesta de 15 años de ' + CONFIG.nombreQuinceanera + '. ¡Nos vemos allá!';
  const url = 'https://wa.me/' + CONFIG.telefonoWhatsapp + '?text=' + encodeURIComponent(mensaje);
  window.open(url, '_blank', 'noopener');
});

/* ================================================================
   8) AUDIO DE FONDO — volumen medio, con respaldo ante bloqueo de
      autoplay (los navegadores móviles requieren un primer toque)
   ================================================================ */
(function audioDeFondo(){
  const audio = document.getElementById('audioFondo');
  audio.src = CONFIG.audioArchivo;
  audio.volume = CONFIG.audioVolumen;

  let yaIniciado = false;

  // Diagnóstico: si el archivo no carga (nombre, ruta o formato incorrecto),
  // esto se ve en la consola del navegador (F12 → Console) como aviso.
  audio.addEventListener('error', () => {
    console.warn('No se pudo cargar el audio "'+CONFIG.audioArchivo+'". Verifica que el archivo esté en la misma carpeta que index.html, que el nombre coincida EXACTAMENTE (mayúsculas/minúsculas) y que sea un .mp3 válido.');
  });

  function intentarReproducir(){
    if(yaIniciado) return;
    const promesa = audio.play();
    if(promesa !== undefined){
      promesa.then(() => {
        yaIniciado = true;
        quitarListeners();
      }).catch(() => {
        /* el navegador bloqueó el autoplay; se reintentará con el próximo gesto del usuario */
      });
    }
  }

  function quitarListeners(){
    document.removeEventListener('click', intentarReproducir);
    document.removeEventListener('touchend', intentarReproducir);
    document.removeEventListener('keydown', intentarReproducir);
  }

  // Intento inmediato al cargar (funciona en algunos navegadores de escritorio)
  intentarReproducir();

  // Respaldo: navegadores móviles (sobre todo iOS Safari) solo desbloquean
  // audio en gestos "click"/"touchend" reales — NO en "pointerdown".
  document.addEventListener('click', intentarReproducir);
  document.addEventListener('touchend', intentarReproducir);
  document.addEventListener('keydown', intentarReproducir);
})();

/* ================================================================
   9) PROTECCIÓN BÁSICA CONTRA DESCARGA
      (disuade a un visitante casual; no es un cifrado real: cualquier
      archivo que el navegador puede mostrar o reproducir, técnicamente
      puede "capturarse" — por ejemplo con una captura de pantalla o
      grabación de pantalla, o por alguien con conocimientos técnicos
      que abra las herramientas de desarrollador. Estas medidas bloquean
      las formas más comunes: clic derecho, arrastrar y soltar, mantener
      presionado en móvil, y atajos de teclado típicos de guardado)
   ================================================================ */
(function proteccionBasica(){
  // Bloquear menú contextual (clic derecho / mantener presionado) en toda la página
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // Bloquear arrastrar cualquier elemento (imágenes, enlaces)
  document.addEventListener('dragstart', (e) => e.preventDefault());

  // Bloquear selección de texto/contenido
  document.addEventListener('selectstart', (e) => e.preventDefault());

  // Bloquear atajos comunes de guardado / inspección
  document.addEventListener('keydown', (e) => {
    const tecla = e.key ? e.key.toLowerCase() : '';
    const combinacionGuardarVer =
      ((e.ctrlKey || e.metaKey) && (tecla === 's' || tecla === 'u')) || // Ctrl/Cmd+S, Ctrl/Cmd+U
      ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','j','c'].includes(tecla)) || // DevTools
      tecla === 'f12';
    if(combinacionGuardarVer){
      e.preventDefault();
    }
  });
})();
</script>
